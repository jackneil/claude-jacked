# Pre-commit secret + workflow checks. Run `pre-commit install` once.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.31.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
