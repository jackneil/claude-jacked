[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-jacked"
dynamic = ["version"]
description = "Multi-account manager + skills suite for Claude Code (and Codex) — live usage tracking, auto account-switching, menu-bar pill, 30 slash commands, web dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jack Neil", email = "jack@jackmd.com" }
]
keywords = ["claude", "claude-code", "codex", "account-management", "usage-tracking", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0,<9",
    "python-dotenv>=1.2.2,<2",
    "rich>=13.0,<16",
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.20,<1",
    "httpx>=0.24,<1",
    "aiohttp>=3.9,<4",
    "packaging>=23.0,<26",
    "anthropic>=0.40,<1",
    # Tray icon is ON by default — pystray/Pillow are core so a bare
    # `uv tool install claude-jacked` lights up the tray with no extra needed.
    # Opt out of the icon at runtime with `jacked install --no-tray`. Headless
    # CI/servers still pull these but the tray degrades gracefully (the service
    # runs; the icon is skipped when there's no display).
    "pystray>=0.19,<1",
    "Pillow>=9.0,<13",
    # macOS menu-bar app (darwin-ONLY): rumps status item + PyObjC NSPopover/
    # NSPanel hosting WKWebViews at /panel. Windows/Linux keep the existing
    # pystray tray and never resolve or install these (the marker gates them).
    "rumps>=0.4,<1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10,<12; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10,<12; sys_platform == 'darwin'",
]

[project.optional-dependencies]
search = [
    "qdrant-client>=1.7,<2",
]
security = []  # backwards compat — anthropic is now a core dependency
web = []
tray = []  # backwards compat — pystray/Pillow are now CORE deps (tray on by default)
all = [
    "qdrant-client>=1.7,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0,<8",
    "qdrant-client>=1.7,<2",
    "websockets>=12.0,<17",
    # Tray extra — without these the entire tray test suite skips (and the
    # @patch(...pystray) tests fail before reaching their skip guard).
    "pystray>=0.19,<1",
    "Pillow>=9.0,<13",
    # Pinned ruff so the pre-push hook uses ONE deterministic version from
    # .venv instead of whatever stray conda env sorts first on PATH.
    "ruff>=0.6,<1",
]

[project.scripts]
jacked = "jacked.cli:main"

[project.urls]
Homepage = "https://github.com/jackneil/claude-jacked"
Repository = "https://github.com/jackneil/claude-jacked"
Issues = "https://github.com/jackneil/claude-jacked/issues"

[tool.hatch.version]
path = "jacked/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jacked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Supply-chain hardening: uv resolves only versions uploaded before this date.
# Defends against smash-and-grab attacks (axios 1.14.1, Shai-Hulud, etc.) — gives
# the community time to flag a poisoned release before it lands in our build.
# Bump as part of intentional dep refreshes (≥ 7 days ago is the minimum standard).
[tool.uv]
exclude-newer = "2026-05-13T00:00:00Z"
