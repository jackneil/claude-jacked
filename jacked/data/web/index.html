<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Apply the CACHED color theme before first paint to avoid a flash of the
         wrong scheme. Unset defaults to America 250 (red/white/blue); only an
         explicit 'classic' opts out. This localStorage key is a cache, not the
         source of truth: settings.js reconciles it against the server setting
         'color_theme' right after load, because the menu-bar panel's WKWebView
         has its own separate localStorage and can only learn the choice from
         the server. Key mirrors settings.js's COLOR_THEME_KEY. -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('jacked_color_theme') !== 'classic') {
                    document.documentElement.classList.add('theme-america250');
                }
            } catch (e) {}
        })();
    </script>
    <title>jacked — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#172033',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/token-pills.css">
    <link rel="stylesheet" href="/css/swal-dark.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex" style="-webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">

    <!-- Hamburger button (mobile only) -->
    <button id="sidebar-toggle" class="fixed top-3 left-3 z-50 p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 transition active:scale-[0.96] md:hidden">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <!-- Sidebar backdrop overlay (mobile only) -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden"></div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="w-56 bg-slate-800 border-r border-slate-700 hidden md:flex md:flex-col min-h-screen fixed left-0 top-0 bottom-0 z-40">
        <!-- relative anchors the America 250 accent stripe to the block's bottom edge -->
        <div class="p-4 border-b border-slate-700 relative">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold text-white tracking-tight">jacked</h1>
                <!-- Inline SVG flag (NOT the 🇺🇸 emoji — Windows renders it as "US"
                     letters). Simplified: 5 white stripes, blue canton, 9 star dots.
                     Default-hidden; shown only under html.theme-america250. -->
                <span class="america-250-badge america-250-flag" aria-hidden="true" title="America 250 theme">
                    <svg width="22" height="12" viewBox="0 0 190 100" role="img" aria-label="US flag">
                        <defs>
                            <clipPath id="a250-flag-clip"><rect width="190" height="100" rx="10"/></clipPath>
                        </defs>
                        <g clip-path="url(#a250-flag-clip)">
                            <rect width="190" height="100" fill="#B22234"/>
                            <rect y="9.09" width="190" height="9.09" fill="#FFFFFF"/>
                            <rect y="27.27" width="190" height="9.09" fill="#FFFFFF"/>
                            <rect y="45.45" width="190" height="9.09" fill="#FFFFFF"/>
                            <rect y="63.64" width="190" height="9.09" fill="#FFFFFF"/>
                            <rect y="81.82" width="190" height="9.09" fill="#FFFFFF"/>
                            <rect width="76" height="54.55" fill="#3C3B6E"/>
                            <g fill="#FFFFFF">
                                <circle cx="15" cy="13.6" r="4.5"/>
                                <circle cx="38" cy="13.6" r="4.5"/>
                                <circle cx="61" cy="13.6" r="4.5"/>
                                <circle cx="15" cy="27.3" r="4.5"/>
                                <circle cx="38" cy="27.3" r="4.5"/>
                                <circle cx="61" cy="27.3" r="4.5"/>
                                <circle cx="15" cy="40.9" r="4.5"/>
                                <circle cx="38" cy="40.9" r="4.5"/>
                                <circle cx="61" cy="40.9" r="4.5"/>
                            </g>
                        </g>
                    </svg>
                </span>
            </div>
            <div id="version-info" class="text-xs text-slate-400 mt-1"></div>
            <!-- Tricolor semiquincentennial micro-badge — default-hidden. -->
            <div class="america-250-badge america-250-years text-[10px] mt-1 font-semibold tracking-wide">
                <span style="color:#ef4444">1776</span>
                <span class="text-slate-500">·</span>
                <span style="color:#f8fafc">2026</span>
                <span class="text-slate-500">—</span>
                <span style="color:#60a5fa">250 YEARS</span>
            </div>
            <!-- 2px red/white/blue accent across the header's bottom edge — default-hidden. -->
            <div class="america-250-badge america-250-stripe" aria-hidden="true"></div>
        </div>

        <div class="flex-1 py-2">
            <a href="#accounts" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors" data-route="accounts">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                Accounts
            </a>
            <a href="#installations" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors" data-route="installations">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M9 3h6l1 4H8L9 3z"/></svg>
                Installations
            </a>
            <a href="#settings" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors" data-route="settings">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Settings
            </a>
            <a href="#logs" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors" data-route="logs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                Logs
            </a>
            <a href="#analytics" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition-colors" data-route="analytics">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                Analytics
            </a>
        </div>

        <div class="p-4 border-t border-slate-700">
            <button id="btn-refresh-all" class="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-700 rounded transition active:scale-[0.96]" title="Refresh all data">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh All
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="content" class="flex-1 min-w-0 ml-0 md:ml-56 p-3 md:p-6">
        <!-- Dynamic content rendered here by router -->
        <div class="flex items-center justify-center h-64">
            <div class="text-slate-500">Loading...</div>
        </div>
    </main>

    <!-- Auto-swap stall watchdog banner (hidden by default; shown by showStallBanner) -->
    <div id="auto-swap-stall-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-900/95 border border-red-700 rounded-lg px-5 py-3 shadow-lg max-w-lg flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span class="stall-text text-sm text-red-100"></span>
        <button class="text-red-400 hover:text-white text-lg leading-none ml-auto transition active:scale-[0.96]" onclick="document.getElementById('auto-swap-stall-banner').classList.add('hidden')" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Toast container for notifications -->
    <div id="toast-container" class="fixed bottom-2 right-2 md:bottom-4 md:right-4 left-2 md:left-auto flex flex-col gap-2 z-50 max-w-[calc(100vw-1rem)] md:max-w-sm"></div>

    <!-- Scripts -->
    <script src="/js/websocket.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/util/provider.js"></script>
    <script src="/js/components/oauth-flows.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/components/header.js"></script>
    <script src="/js/components/install-summary.js"></script>
    <script src="/js/components/usage.js"></script>
    <script src="/js/components/token-pills.js"></script>
    <script src="/js/components/auto-swap.js"></script>
    <script src="/js/components/accounts.js"></script>
    <script src="/js/components/sessions.js"></script>
    <script src="/js/components/account-actions.js"></script>
    <script src="/js/components/installations.js"></script>
    <script src="/js/components/remote-access.js"></script>
    <script src="/js/components/settings.js"></script>
    <script src="/js/components/logs.js"></script>
    <script src="/js/components/logs-hooks.js"></script>
    <script src="/js/components/logs-version-checks.js"></script>
    <script src="/js/components/logs-server.js"></script>
    <script src="/js/components/analytics.js"></script>
    <script src="/js/components/usage-overview.js"></script>
    <script src="/js/components/usage-sessions.js"></script>
    <script src="/js/components/usage-trends.js"></script>
</body>
</html>
