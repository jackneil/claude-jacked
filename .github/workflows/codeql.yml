# CodeQL code scanning, advanced setup (#199i). Keep GitHub default setup
# off for this repository: when default setup is on, GitHub refuses the
# results that this workflow uploads.
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Each Monday at 07:31 UTC, so that new CodeQL queries also examine the
    # code that did not change.
    - cron: "31 7 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    permissions:
      contents: read          # check out the repository
      security-events: write  # upload the results to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # These three languages need no build step. CodeQL reads the
          # source files directly.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
