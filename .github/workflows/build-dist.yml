# Builds the wheel, the sdist and the SBOM from the hash-locked tool set.
# Two callers run this same job: publish.yml (the real release) and
# tests.yml (a rehearsal on every pull request). The rehearsal exists because
# ci-publish.txt is used only here: a bad lock (a dropped Python 3.11
# dependency, an sdist-only pin) otherwise surfaces only after the GitHub
# Release, the irreversible trigger, is already cut.
name: Build distribution

on:
  workflow_call:
    inputs:
      upload:
        description: Upload dist/ and the SBOM as artifacts for a later job.
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        # Hash-locked (.github/requirements/ci-publish.txt, from ci-publish.in):
        # every tool and transitive dependency is verified by hash. The venv
        # has no pip and no setuptools, so the build sees only locked packages.
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/pub"
          python -m pip --python "$RUNNER_TEMP/pub/bin/python" install --require-hashes --only-binary=:all: -r .github/requirements/ci-publish.txt

      - name: Build package
        # --no-isolation: build with the hash-locked hatchling installed above.
        # An isolated build downloads the [build-system] backend again from
        # PyPI with no pin, no hash and no cooldown.
        run: '"$RUNNER_TEMP/pub/bin/python" -m build --no-isolation'

      # Validate the built metadata HERE, in the reversible build job, rather
      # than discovering it in the publish step after the GitHub Release (the
      # irreversible trigger) has already been cut. v0.92.0 failed exactly that
      # way: hatchling 1.32.0 emits Metadata-Version 2.5, and the publish
      # action's pinned twine predated twine v7 and rejected it.
      - name: Check distribution metadata
        run: '"$RUNNER_TEMP/pub/bin/twine" check dist/*'

      - name: Generate CycloneDX SBOM
        # SBOM must live OUTSIDE dist/ — twine check rejects unknown files in dist/.
        run: '"$RUNNER_TEMP/pub/bin/cyclonedx-py" environment -o sbom.cdx.json'

      - name: Upload artifact
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
