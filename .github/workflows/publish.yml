name: Publish to PyPI

on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          pip install --only-binary=:all: build hatchling cyclonedx-bom twine

      - name: Build package
        run: python -m build

      # Validate the built metadata HERE, in the reversible build job, rather
      # than discovering it in the publish step after the GitHub Release (the
      # irreversible trigger) has already been cut. v0.92.0 failed exactly that
      # way: hatchling 1.32.0 emits Metadata-Version 2.5, and the publish
      # action's pinned twine predated twine v7 and rejected it.
      - name: Check distribution metadata
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        # SBOM must live OUTSIDE dist/ — twine check rejects unknown files in dist/.
        run: cyclonedx-py environment -o sbom.cdx.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      # Display link only (the OIDC trusted-publisher target comes from the
      # built artifact's name); point it at the real project, not the unrelated
      # `jacked` package.
      url: https://pypi.org/p/claude-jacked
    permissions:
      id-token: write          # OIDC for PyPI Trusted Publishers (scoped to publish job only)
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # v1.14.2 is the first release carrying twine v7 (upstream issue #416,
      # closed 2026-07-28). The previous pin was cut 2026-02-18 and its twine
      # rejected Metadata-Version 2.5, which current hatchling now emits.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
