name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    # The same job runs on every pull request as a rehearsal (tests.yml).
    uses: $/.github/workflows/build-dist.yml
    permissions:
      contents: read
    with:
      upload: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      # Display link only (the OIDC trusted-publisher target comes from the
      # built artifact's name); point it at the real project, not the unrelated
      # `jacked` package.
      url: https://pypi.org/p/claude-jacked
    permissions:
      id-token: write          # OIDC for PyPI Trusted Publishers (scoped to publish job only)
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # v1.14.2 is the first release carrying twine v7 (upstream issue #416,
      # closed 2026-07-28). The previous pin was cut 2026-02-18 and its twine
      # rejected Metadata-Version 2.5, which current hatchling now emits.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
