name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        # Hash-locked (.github/requirements/ci-uv.txt, from ci-uv.in).
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci-uv.txt

      - name: Lint
        # The rule set is pinned in pyproject.toml ([tool.ruff.lint]).
        run: uv run --frozen ruff check .

      - name: Run tests
        run: uv run --frozen python -m pytest

  supply-chain:
    # Blocks a merge on a known advisory in any locked package (OSV) and on a
    # workflow finding (zizmor). One Linux runner, a few minutes.
    name: Supply chain (pip-audit + zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv, pip-audit and zizmor
        # Hash-locked (.github/requirements/ci-uv.txt and ci-audit.txt, from
        # their .in files), wheels only.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci-uv.txt
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci-audit.txt

      - name: Audit every locked package (OSV)
        run: |
          uv export --frozen --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/locked.txt"
          pip-audit -r "$RUNNER_TEMP/locked.txt" --require-hashes --disable-pip --vulnerability-service osv

      - name: Audit the workflows (zizmor)
        run: zizmor --no-progress .github/workflows
