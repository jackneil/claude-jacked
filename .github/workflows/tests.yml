name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 / ubuntu-latest
            os: ubuntu-latest
            command: uv run --frozen python -m pytest
          - name: Python 3.11 / macos-14
            os: macos-14
            command: uv run --frozen python -m pytest
          - name: Windows diagnostic / Codex usage module
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/unit/test_codex_usage.py
          - name: Windows diagnostic / service plus Codex usage
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/integration
              tests/unit/service
              tests/unit/test_codex_usage.py
          - name: Windows diagnostic / lead-in plus Codex usage
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/unit/test_account_label.py
              tests/unit/test_account_truth_database.py
              tests/unit/test_active_account_cc_skip.py
              tests/unit/test_active_sessions.py
              tests/unit/test_analytics_anomalies.py
              tests/unit/test_analytics_api.py
              tests/unit/test_analytics_db.py
              tests/unit/test_analytics_paths.py
              tests/unit/test_analytics_scanner.py
              tests/unit/test_auto_swap.py
              tests/unit/test_browser_launch.py
              tests/unit/test_chain_of_command_hook.py
              tests/unit/test_chrome_devtools_mcp.py
              tests/unit/test_claude_skill_preservation.py
              tests/unit/test_cli_dcr.py
              tests/unit/test_cli_first_run_and_tray.py
              tests/unit/test_codex_add.py
              tests/unit/test_codex_credentials.py
              tests/unit/test_codex_installer.py
              tests/unit/test_codex_switching.py
              tests/unit/test_codex_usage.py
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --only-binary=:all: uv

      - name: Run tests
        run: ${{ matrix.command }}
