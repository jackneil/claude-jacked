name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 / ubuntu-latest
            os: ubuntu-latest
            command: uv run --frozen python -m pytest
          - name: Python 3.11 / macos-14
            os: macos-14
            command: uv run --frozen python -m pytest
          - name: Windows diagnostic / native core
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/integration
              tests/unit/service/test_instance.py
              tests/unit/service/test_platform.py
              tests/unit/service/test_process.py
              tests/unit/service/test_windows_security.py
              tests/unit/test_codex_usage.py::test_read_rate_limits_real_subprocess_roundtrip
          - name: Windows diagnostic / supervisors
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/unit/service/test_autostart.py
              tests/unit/service/test_spec.py
              tests/unit/service/test_supervisor_core.py
              tests/unit/service/test_supervisor_launchd.py
              tests/unit/service/test_supervisor_task_scheduler.py
              tests/unit/service/test_supervisor_uninstall.py
              tests/unit/test_codex_usage.py::test_read_rate_limits_real_subprocess_roundtrip
          - name: Windows diagnostic / lifecycle tray
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/unit/service/test_cli.py
              tests/unit/service/test_launcher.py
              tests/unit/service/test_lifecycle.py
              tests/unit/service/test_menubar_platform.py
              tests/unit/service/test_tray.py
              tests/unit/service/test_tray_install.py
              tests/unit/test_codex_usage.py::test_read_rate_limits_real_subprocess_roundtrip
          - name: Windows diagnostic / baseline service
            os: windows-latest
            command: >-
              uv run --frozen python -m pytest -vv
              tests/unit/service/test_bind.py
              tests/unit/service/test_ensure_native_lifecycle.py
              tests/unit/service/test_environment.py
              tests/unit/service/test_icon.py
              tests/unit/service/test_ipc.py
              tests/unit/service/test_menubar_summary.py
              tests/unit/service/test_menubar_usage_watch.py
              tests/unit/service/test_migrate.py
              tests/unit/service/test_multi_socket_serving.py
              tests/unit/service/test_native_restart.py
              tests/unit/service/test_phase_drift.py
              tests/unit/service/test_restart.py
              tests/unit/service/test_termination.py
              tests/unit/service/test_update_phases.py
              tests/unit/service/test_update_status.py
              tests/unit/service/test_updater.py
              tests/unit/test_codex_usage.py::test_read_rate_limits_real_subprocess_roundtrip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --only-binary=:all: uv

      - name: Run tests
        run: ${{ matrix.command }}
