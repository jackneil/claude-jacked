name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --only-binary=:all: uv

      - name: Run tests
        if: runner.os != 'Windows'
        run: uv run --frozen python -m pytest

      - name: Bisect Windows test-state pollution
        if: runner.os == 'Windows'
        run: >-
          uv run --frozen python -m pytest -vv
          -k "account_label or account_truth_database or active_account_cc_skip
          or active_sessions or analytics_anomalies or analytics_api or analytics_db
          or analytics_paths or analytics_scanner or auto_swap or browser_launch
          or chain_of_command_hook or chrome_devtools_mcp or claude_skill_preservation
          or cli_dcr or cli_first_run_and_tray or codex_add or codex_credentials
          or codex_installer or codex_switching
          or test_read_rate_limits_real_subprocess_roundtrip"
