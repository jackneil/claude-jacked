name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, and it floats like the other two legs:
        # a pinned macOS label fails once GitHub retires its image (macos-14
        # on 2026-11-02, actions/runner-images issue 13518).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The default is 360 minutes: a hung test would hold the runner for six
    # hours. 40 is above the slowest serial run seen (Windows, 37 minutes).
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        # Hash-locked (.github/requirements/ci-uv.txt, from ci-uv.in).
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci-uv.txt

      - name: Check that uv.lock is current
        # The steps below use --frozen, which never compares uv.lock with
        # pyproject.toml. This step fails when a pyproject.toml change arrives
        # without its uv.lock update. It uses the hash-locked uv from above.
        run: uv lock --check

      - name: Lint
        # The rule set is pinned in pyproject.toml ([tool.ruff.lint]).
        run: uv run --frozen ruff check .

      - name: Fast temp folder and more test workers (Windows)
        # The Windows tests wait on disk and on process starts, not on CPU,
        # and TEMP (every tmp_path and test home) is on the slow C: drive.
        # Measured on windows-latest (#321i, runs 44914344094 and 44915971937):
        # pytest took 872 s with TEMP on C: and 4 workers, 445 s with TEMP on
        # D:, and 258 to 281 s with TEMP on D: and 8 workers (the runner has
        # 4 CPUs; 12 workers were not faster).
        # PYTEST_XDIST_AUTO_NUM_WORKERS sets what `-n auto` means, so the
        # test command below stays the same on every OS. The folder is inside
        # RUNNER_TEMP, which the runner empties at the start and the end of
        # each job, so no file from another job can be there (Python 3.11.9
        # does not restrict the ACL of a mkdtemp folder outside the user
        # profile, CVE-2024-4030). A runner whose RUNNER_TEMP is not on D:
        # keeps the defaults and says so.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_TEMP -like 'D:\*') {
            $tmp = Join-Path $env:RUNNER_TEMP 'pytest-tmp'
            New-Item -ItemType Directory -Force $tmp | Out-Null
            "TEMP=$tmp" >> $env:GITHUB_ENV
            "TMP=$tmp" >> $env:GITHUB_ENV
            "PYTEST_XDIST_AUTO_NUM_WORKERS=8" >> $env:GITHUB_ENV
            Write-Output "TEMP and TMP: $tmp; pytest-xdist workers: 8"
          } else {
            Write-Output "::warning::RUNNER_TEMP ($env:RUNNER_TEMP) is not on D: on this runner image: TEMP stays on C: and the Windows tests run about 3 times slower"
          }

      - name: Run tests
        # -n auto: one pytest-xdist worker per CPU that the runner reports
        # (Windows: the step above). Serial, the Windows leg took 26 to 37
        # minutes. --durations=30 names the slowest tests in every log, so a
        # slow test shows up in the first run that carries it; a hung test
        # prints its stack after faulthandler_timeout (pyproject.toml).
        run: uv run --frozen python -m pytest -n auto --durations=30

  release-rehearsal:
    # Runs the release build job (build-dist.yml) without publishing, so a
    # broken ci-publish.txt fails here instead of after a release is cut.
    name: Release rehearsal (build + twine check + SBOM)
    uses: $/.github/workflows/build-dist.yml
    permissions:
      contents: read

  supply-chain:
    # Blocks a merge on a known advisory in any locked package (OSV) and on a
    # workflow finding (zizmor). One Linux runner, a few minutes.
    name: Supply chain (pip-audit + zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Prove every locked file is past the cooldown
        # Dependabot's cooldown covers the package it bumps, not the new
        # transitive pins that bump pulls in (#312i). This fails when PyPI
        # says any file in uv.lock or a hash-locked CI file was uploaded less
        # than 7 days ago (the default-days of each Dependabot entry and the
        # exclude-newer rule in pyproject.toml) or is yanked. Standard
        # library only; ~160 PyPI requests, 16 at a time, a few seconds.
        timeout-minutes: 5
        run: python scripts/ci/check_pin_age.py --min-days 7 uv.lock .github/requirements/*.txt

      - name: Install uv, pip-audit and zizmor
        # Hash-locked (.github/requirements/ci-uv.txt and ci-audit.txt, from
        # their .in files), wheels only.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci-uv.txt
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci-audit.txt

      - name: Audit every locked package (OSV)
        # Markers are stripped so the macOS-only and Windows-only pins are
        # audited too (pip-audit would evaluate them for this Linux runner and
        # skip them); the step fails unless the audited set is exactly the
        # lock's registry packages.
        run: |
          uv export --frozen --format requirements-txt --no-emit-project --no-hashes --no-annotate --no-header -o "$RUNNER_TEMP/export.txt"
          sed -E 's/ *;.*$//' "$RUNNER_TEMP/export.txt" | sort -u > "$RUNNER_TEMP/locked.txt"
          python - "$RUNNER_TEMP/locked.txt" <<'PY'
          import re, sys
          lock = open("uv.lock", encoding="utf-8").read()
          locked = {f"{n}=={v}".lower() for n, v in re.findall(r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"\nsource = \{ registry', lock)}
          audited = {line.strip().lower() for line in open(sys.argv[1], encoding="utf-8") if line.strip()}
          print(f"auditing {len(audited)} of {len(locked)} locked packages")
          sys.exit(0 if locked and audited == locked else f"coverage mismatch: missing {sorted(locked - audited)}, extra {sorted(audited - locked)}")
          PY
          pip-audit -r "$RUNNER_TEMP/locked.txt" --no-deps --disable-pip --vulnerability-service osv

      - name: Audit the workflows (zizmor)
        # --strict-collection: a workflow zizmor cannot parse fails the job
        # instead of being skipped.
        run: zizmor --no-progress --strict-collection .github/workflows
