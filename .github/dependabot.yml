# Dependabot config with 7-day cooldown.
# Cooldown is the cheapest defense against smash-and-grab attacks (axios 1.14.1, Shai-Hulud, etc.) —
# delays accepting newly-published versions long enough for the community to flag them.
version: 2
updates:
  # "uv", not "pip": the pip ecosystem bumped pyproject.toml ranges without
  # touching uv.lock, so its PRs never changed what CI or installs resolve.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Hash-locked CI tooling (uv, build, hatchling, twine, cyclonedx-bom).
  # "uv", not "pip": each .txt here is `uv pip compile --universal` output,
  # and the uv updater re-runs that compile with the --universal and
  # --python-version flags from the file header. The pip updater re-ran
  # pip-compile for the runner's Python and dropped the 3.11-only pins
  # (#298pr: backports-tarfile), which breaks the release build. The
  # "Release rehearsal" job in tests.yml installs ci-publish.txt the way
  # publish.yml does, so a bad bump fails on its own pull request.
  # The cooldown covers only the bumped package: the updater compiles
  # without --exclude-newer, so a bump can drag in a transitive pin that is
  # hours old. The pin-age step in tests.yml (scripts/ci/check_pin_age.py)
  # fails that pull request until every locked file is 7 days old (#312i).
  # Keep default-days here equal to its --min-days (a test pins this).
  - package-ecosystem: "uv"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci-deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
