# Dependabot config with 7-day cooldown.
# Cooldown is the cheapest defense against smash-and-grab attacks (axios 1.14.1, Shai-Hulud, etc.) —
# delays accepting newly-published versions long enough for the community to flag them.
version: 2
updates:
  # "uv", not "pip": the pip ecosystem bumped pyproject.toml ranges without
  # touching uv.lock, so its PRs never changed what CI or installs resolve.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Hash-locked CI tooling (uv, build, hatchling, twine, cyclonedx-bom).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci-deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
